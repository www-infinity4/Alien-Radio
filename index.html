<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infinity Radio</title>
<meta name="description" content="Infinity Radio classical piano with live precious and industrial metal prices.">
<meta property="og:type" content="website">
<meta property="og:title" content="Infinity Radio">
<meta property="og:description" content="Classical piano · live metals · deep focus.">
<meta property="og:url" content="https://www-infinity4.github.io/Alien-Radio/">
<meta property="og:image" content="https://www-infinity4.github.io/Alien-Radio/infinity-radio-preview.png">
<meta property="og:image:width" content="1664">
<meta property="og:image:height" content="928">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Infinity Radio">
<meta name="twitter:description" content="Classical piano · live metals · deep focus.">
<meta name="twitter:image" content="https://www-infinity4.github.io/Alien-Radio/infinity-radio-preview.png">
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;background:#020812;color:#dff;font-family:Arial,sans-serif}
.radio-shell{max-width:760px;margin:auto;padding:14px}
.radio-title{text-align:center;font-size:28px;letter-spacing:4px;margin:12px 0 18px}
.metals{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px}
.metal-widget{width:225px;height:106px;flex:0 0 225px;border:1px solid #314457;border-radius:8px;background:#06101d}
.player{margin-top:18px;border:1px solid #21465b;border-radius:14px;padding:28px 18px;text-align:center;background:#071426}
.player h1{font-size:22px;letter-spacing:2px;margin:0 0 8px}.player p{opacity:.72}
#play-btn{width:76px;height:76px;border-radius:50%;border:1px solid #16d9d1;background:#092438;color:white;font-size:30px;margin-top:15px}
.ad-rail{margin-top:14px;border:1px solid #314457;border-radius:10px;background:#06101d;padding:10px;min-height:58px}
.ad-label{font-size:10px;letter-spacing:1.5px;opacity:.6;margin-bottom:6px}
#ad-slot{font-size:14px;line-height:1.4} #ad-slot a{color:#dff}
</style>
</head>
<body>
<div class="radio-shell">
<div class="radio-title">INFINITY RADIO</div>
<section class="metals" aria-label="Live metal prices">
<iframe class="metal-widget" title="Gold" src="https://metal-sentinel.com/widget/AU?currency=USD&amp;theme=space"></iframe>
<iframe class="metal-widget" title="Silver" src="https://metal-sentinel.com/widget/AG?currency=USD&amp;theme=space"></iframe>
<iframe class="metal-widget" title="Platinum" src="https://metal-sentinel.com/widget/PT?currency=USD&amp;theme=space"></iframe>
<iframe class="metal-widget" title="Palladium" src="https://metal-sentinel.com/widget/PD?currency=USD&amp;theme=space"></iframe>
<iframe class="metal-widget" title="Copper" src="https://metal-sentinel.com/widget/CU?currency=USD&amp;theme=space"></iframe>
<iframe class="metal-widget" title="Nickel" src="https://metal-sentinel.com/widget/NI?currency=USD&amp;theme=space"></iframe>
<iframe class="metal-widget" title="Aluminum" src="https://metal-sentinel.com/widget/AL?currency=USD&amp;theme=space"></iframe>
<iframe class="metal-widget" title="Zinc" src="https://metal-sentinel.com/widget/ZN?currency=USD&amp;theme=space"></iframe>
<iframe class="metal-widget" title="Lead" src="https://metal-sentinel.com/widget/PB?currency=USD&amp;theme=space"></iframe>
</section>
<main class="player">
<div id="np-channel">CLASSICAL PIANO</div>
<h1 id="np-title">INFINITY RADIO</h1>
<p id="np-artist">Continuous classical piano</p>
<button id="play-btn" type="button" onclick="togglePlay()" aria-label="Play or pause">▶</button>
<div id="piano-status">Piano Radio</div>
<div id="freq-display" hidden>88.1</div><div id="channel-name" hidden>PIANO</div><div id="signal-bars" hidden></div><ul id="channel-list" hidden></ul><div id="sig-meter-signal" hidden></div>
</main>
<section class="ad-rail" aria-label="Phi collects">
  <div class="ad-label">QUANTA PHI COLLECTS</div>
  <div id="quanta-feed">Open Quanta Phi and collect cards to build this feed.</div>
  <div class="ad-label" style="margin-top:12px">SPONSORED</div>
  <div id="ad-slot">No collect-based sponsor available yet.</div>
</section>
</div>
<script src="https://www-infinity4.github.io/Control-Phi/control-phi.js?v=20260925-wallet5"></script>
<script src="app.js?v=20260925-piano20-front2"></script>
</body>
</html>
