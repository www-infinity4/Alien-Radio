<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop Phi — Similar Products</title>
<meta name="description" content="Compare related products, brands, styles, and outlets from one topic-first shopping field.">
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#24170f;font:15px/1.45 system-ui,sans-serif}.shell{max-width:1120px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px}.brand{font-size:25px;font-weight:950;letter-spacing:.12em}.phi{color:#67f6e8}.back{margin-left:auto;color:#bff;text-decoration:none;border:1px solid #285b6a;border-radius:12px;padding:10px}.search{display:flex;gap:8px;margin:20px 0}.search input{flex:1;min-width:0;padding:14px;border:1px solid #315d75;border-radius:12px;background:#071321;color:white;font-size:16px}.search button{padding:12px 16px;border:0;border-radius:12px;background:#ffe15a;color:#171000;font-weight:900}.sub{color:#9bb7c4}.outlets{display:flex;gap:8px;overflow:auto;padding:8px 0 16px}.outlet{white-space:nowrap;border:1px solid #f0b36a;border-radius:999px;padding:9px 13px;color:#c65a08;background:#fff;font:800 13px system-ui;cursor:pointer}.outlet.active{background:#fff0df;border-color:#e66a0a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{overflow:hidden;border:2px solid #f0a14a;border-radius:22px;background:linear-gradient(145deg,#f97316,#c2410c);color:white;text-decoration:none;box-shadow:0 10px 28px #9a34121f}.card img{width:100%;height:240px;object-fit:contain;object-position:center;display:block;padding:14px;background:#ffedd5}.copy{padding:12px}.copy strong{display:block;font-size:14px}.copy small{display:block;color:#9bb7c4;margin-top:5px}.shop{display:inline-block;margin-top:10px;background:#fff;color:#ea580c;border-radius:999px;padding:7px 10px;font-weight:900;font-size:11px}.disclosure{margin:22px 0;color:#7893a0;font-size:11px}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand">SHOP <span class="phi">PHI</span></div><a class="back" href="https://www-infinity4.github.io/Alien-Radio/">← Infinity Radio</a></header>
<p class="sub">Similar and exact products across brands, styles, and outlets.</p>
<form class="search" id="shopSearch"><input id="q" type="search" placeholder="Search products and comparisons"><button>Shop φ</button></form>
<div class="outlets" id="outlets"><button class="outlet" data-outlet="eBay">eBay</button><button class="outlet" data-outlet="Walmart">Walmart</button><button class="outlet" data-outlet="Etsy">Etsy</button><button class="outlet" data-outlet="Reverb">Reverb</button><button class="outlet" data-outlet="Discogs">Discogs</button><button class="outlet" data-outlet="Google Shopping">Google Shopping</button></div>
<section class="grid" id="grid"></section>
<p class="disclosure">Product discovery demonstration. Prices, availability, seller terms, and checkout are controlled by each merchant. Paid placements will be labeled separately.</p>
</main>
<script src="control-phi.js?v=20260927-context1"></script>
<script>
const params=new URLSearchParams(location.search),input=document.getElementById('q'),grid=document.getElementById('grid');
const seed=(params.get('q')||'piano music').trim(); input.value=seed;
const generalVariants=[
 {label:'Exact matches',suffix:'exact item product listing',outlet:'eBay',url:q=>'https://www.ebay.com/sch/i.html?'+new URLSearchParams({_nkw:q,LH_BIN:'1'})},
 {label:'Different brands',suffix:'alternative brand product',outlet:'Walmart',url:q=>'https://www.walmart.com/search?'+new URLSearchParams({q})},
 {label:'Independent styles',suffix:'handmade custom design',outlet:'Etsy',url:q=>'https://www.etsy.com/search?'+new URLSearchParams({q})},
 {label:'Collector choices',suffix:'rare collectible authentic',outlet:'eBay',url:q=>'https://www.ebay.com/sch/i.html?'+new URLSearchParams({_nkw:q})},
 {label:'Compare outlets',suffix:'price comparison buy',outlet:'Google Shopping',url:q=>'https://www.google.com/search?'+new URLSearchParams({tbm:'shop',q})},
 {label:'Budget choices',suffix:'best value sale',outlet:'Walmart',url:q=>'https://www.walmart.com/search?'+new URLSearchParams({q})}
];
const musicVariants=[
 {label:'Vinyl editions',suffix:'vinyl LP album edition sealed',outlet:'Discogs',url:q=>'https://www.discogs.com/search/?'+new URLSearchParams({q,type:'release'})},
 {label:'Official shirts',suffix:'official licensed band t shirt',outlet:'eBay',url:q=>'https://www.ebay.com/sch/i.html?'+new URLSearchParams({_nkw:q})},
 {label:'Posters and artwork',suffix:'concert poster wall art print',outlet:'Etsy',url:q=>'https://www.etsy.com/search?'+new URLSearchParams({q})},
 {label:'Guitars and effects',suffix:'guitar pedal tone gear',outlet:'Reverb',url:q=>'https://reverb.com/marketplace?'+new URLSearchParams({query:q})},
 {label:'CD and box sets',suffix:'CD deluxe box set remastered',outlet:'eBay',url:q=>'https://www.ebay.com/sch/i.html?'+new URLSearchParams({_nkw:q})},
 {label:'Books and scores',suffix:'biography songbook sheet music',outlet:'Walmart',url:q=>'https://www.walmart.com/search?'+new URLSearchParams({q})},
 {label:'Tour memorabilia',suffix:'tour program ticket memorabilia',outlet:'eBay',url:q=>'https://www.ebay.com/sch/i.html?'+new URLSearchParams({_nkw:q})},
 {label:'Tribute instruments',suffix:'signature instrument collectible',outlet:'Reverb',url:q=>'https://reverb.com/marketplace?'+new URLSearchParams({query:q})},
 {label:'Album display',suffix:'vinyl frame album display stand',outlet:'Etsy',url:q=>'https://www.etsy.com/search?'+new URLSearchParams({q})},
 {label:'Hi-fi listening',suffix:'turntable headphones hi fi listening',outlet:'Walmart',url:q=>'https://www.walmart.com/search?'+new URLSearchParams({q})},
 {label:'Alternate pressings',suffix:'colored vinyl alternate pressing',outlet:'Discogs',url:q=>'https://www.discogs.com/search/?'+new URLSearchParams({q,type:'release'})},
 {label:'Compare every outlet',suffix:'merchandise shopping compare prices',outlet:'Google Shopping',url:q=>'https://www.google.com/search?'+new URLSearchParams({tbm:'shop',q})}
];
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
function isMusic(query){return /\b(album|band|song|music|singer|vinyl|guitar|pink floyd|bach|mozart|beethoven|chopin)\b/i.test(query)}
function render(query){document.title='Shop Phi — '+query;const variants=isMusic(query)?musicVariants:generalVariants;const used=new Set();grid.innerHTML=variants.map((v,i)=>{const productQuery=(query+' '+v.suffix).trim();let imageQuery=productQuery+' isolated retail product photo full item white background';while(used.has(imageQuery))imageQuery+=' '+v.label;used.add(imageQuery);const host='tse'+(i%4+1)+'.mm.bing.net',img='https://'+host+'/th?'+new URLSearchParams({q:imageQuery,w:'700',h:'520',c:'7',rs:'1',p:String(i)}),href=v.url(productQuery);return '<a class="card" data-shop-topic="'+esc(productQuery)+'" target="_blank" rel="noopener noreferrer" href="'+esc(href)+'"><img loading="lazy" src="'+esc(img)+'" alt="'+esc(v.label+' for '+query)+'"><div class="copy"><strong>'+esc(v.label)+'</strong><small>'+esc(v.outlet+' · '+productQuery)+'</small><span class="shop">VIEW PRODUCTS</span></div></a>'}).join('');window.ControlPhi?.recordActivity?.('shop-results',query,{resultCount:variants.length})}
document.getElementById('outlets').addEventListener('click',e=>{const button=e.target.closest('[data-outlet]');if(!button)return;document.querySelectorAll('.outlet').forEach(x=>x.classList.toggle('active',x===button));const outlet=button.dataset.outlet;const variants=(isMusic(input.value)?musicVariants:generalVariants).filter(v=>v.outlet===outlet);if(!variants.length)return;const query=input.value.trim()||seed;const v=variants[0],productQuery=(query+' '+v.suffix).trim();window.ControlPhi?.recordActivity?.('shop-outlet',outlet,{query:productQuery});location.href=v.url(productQuery)});
document.getElementById('shopSearch').onsubmit=e=>{e.preventDefault();const q=input.value.trim();if(!q)return;history.replaceState(null,'','?'+new URLSearchParams({q}));window.ControlPhi?.recordActivity?.('shop-search',q);render(q)};grid.addEventListener('click',event=>{const card=event.target.closest('.card');if(card)window.ControlPhi?.recordActivity?.('shop-open',card.dataset.shopTopic||'product')});render(seed);
</script></body></html>
