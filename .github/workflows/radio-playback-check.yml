name: Infinity Radio playback checks

on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'radio-album-offers.js'
      - 'radio-album-offers.css'
      - 'radio-playback.test.js'
      - 'radio-queue.js'
      - 'test/**'
      - 'scripts/update-radio-catalog.cjs'
      - 'oracle-track-feed.json'
      - '.github/workflows/infinity-radio-library.yml'
      - '.github/workflows/radio-playback-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js && node --check radio-album-offers.js
      - name: Verify continuous playlist playback
        run: node --test radio-playback.test.js test/piano-playback.test.cjs test/radio-continuity.test.cjs test/radio-album-offers.test.cjs
